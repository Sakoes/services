services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homelab.home
    volumes:
      - /srv/services/homepage:/app/config
      - ./config/settings.yaml:/app/config/settings.yaml:ro
      - ./config/dashboard.yaml:/app/config/services.yaml:ro
      - ./config/widgets.yaml:/app/config/widgets.yaml:ro
      - ./config/bookmarks.yaml:/app/config/bookmarks.yaml:ro
    logging:
      driver: journald
      options:
        tag: compose-homepage.service
    restart: unless-stopped
