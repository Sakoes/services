version: "3"
services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host
    volumes:
      - /srv/services/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Europe/Brussels}
    logging:
      driver: journald
      options:
        tag: compose-home-assistant.service
    restart: unless-stopped
