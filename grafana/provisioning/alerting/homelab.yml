# Grafana is the only evaluator; notification delivery is not configured.
# Alloy 1.17.1 internal/component/common/loki/client/metrics.go verifies event names.
apiVersion: 1
groups:
- orgId: 1
  name: homelab
  folder: Infrastructure
  interval: 30s
  rules:
  - uid: homelab-disk
    title: Host filesystem above 85% used
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * (1 - node_filesystem_avail_bytes{job="node",host="homelab",fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|fuse.*"}
          / node_filesystem_size_bytes{job="node",host="homelab",fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|fuse.*"})
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 85
          operator:
            type: and
          reducer:
            type: last
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: Host filesystem above 85% used
      description: 'Inspect df -h /var/lib, inodes and log growth. Loki has no byte
        quota or flood-stage eviction. Reduce collection safely; never delete chunks/checkpoints.
        See README.md: Monitoring.'
    labels:
      host: homelab
      severity: warning
    isPaused: false
  - uid: homelab-targets
    title: Scrape target unavailable or missing
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (1 - up{host="homelab"}) or absent(up{host="homelab",job="node"}) or
          absent(up{host="homelab",job="prometheus"}) or absent(up{host="homelab",job="alloy"})
          or absent(up{host="homelab",job="loki"})
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
    noDataState: Alerting
    execErrState: Alerting
    for: 2m
    annotations:
      summary: Scrape target unavailable or missing
      description: Inspect Prometheus /targets, loopback listeners and systemctl status.
        A healthy scrape proves neither Loki readiness/query success nor log delivery.
        See service-repo README.md (Acceptance gates and rollback).
    labels:
      host: homelab
      severity: warning
    isPaused: false
  - uid: homelab-alloy-retries
    title: Alloy log batch retries
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(increase(loki_write_batch_retries_total{job="alloy"}[5m])) or vector(0)
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
    noDataState: OK
    execErrState: Alerting
    for: 0s
    annotations:
      summary: Alloy log batch retries
      description: Inspect journalctl -u alloy and Loki /ready, disk and permissions.
        Retries are not a loss count; finite retry exhaustion can lose logs.
    labels:
      host: homelab
      severity: warning
    isPaused: false
  - uid: homelab-alloy-drops
    title: Alloy dropped log entries
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(increase(loki_write_dropped_entries_total{job="alloy"}[5m])) or
          vector(0)
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          reducer:
            type: last
    noDataState: OK
    execErrState: Alerting
    for: 0s
    annotations:
      summary: Alloy dropped log entries
      description: Data has been lost. Restore Loki delivery and inspect Alloy errors.
        Positions are not delivery acknowledgements; never delete checkpoints as routine
        recovery.
    labels:
      host: homelab
      severity: warning
    isPaused: false
