version: "3"
services:
  grafana:
    image: docker.io/grafana/grafana:13.3.0
    network_mode: host
    user: "472:0"
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3002"
      GF_SERVER_DOMAIN: grafana.home
      GF_SERVER_ROOT_URL: "http://grafana.home"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:?Set GF_SECURITY_ADMIN_USER in secrets.env}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in secrets.env}"
      GF_SECURITY_SECRET_KEY: "${GF_SECURITY_SECRET_KEY:?Set a stable unique GF_SECURITY_SECRET_KEY in secrets.env}"
    volumes:
      - /srv/services/grafana/data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards:ro
    logging:
      driver: journald
      options:
        tag: compose-grafana.service
    restart: unless-stopped

  mcp-grafana:
    image: docker.io/grafana/mcp-grafana:2.1.1
    network_mode: host
    command: ["-t", "streamable-http", "--address", "127.0.0.1:8001", "--disable-write"]
    environment:
      GRAFANA_URL: "http://127.0.0.1:3002"
      GRAFANA_SERVICE_ACCOUNT_TOKEN: "${GRAFANA_SERVICE_ACCOUNT_TOKEN:?Set GRAFANA_SERVICE_ACCOUNT_TOKEN in secrets.env}"
      MCP_GRAFANA_SERVER_TOKEN: "${MCP_GRAFANA_SERVER_TOKEN:?Set MCP_GRAFANA_SERVER_TOKEN in secrets.env}"
    logging:
      driver: journald
      options:
        tag: compose-grafana.service
    restart: unless-stopped
