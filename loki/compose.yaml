version: "3"
services:
  loki:
    image: docker.io/grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    network_mode: host
    user: "10001:10001"
    command:
      - -config.file=/etc/loki/loki.yml
      - -target=all
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - /srv/services/loki/data:/loki
    logging:
      driver: journald
      options:
        tag: compose-loki.service
    restart: unless-stopped
